steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-image-editor-backend:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-image-editor-backend:latest'
      - '.'
  
  # Push the container images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-image-editor-backend:$BUILD_ID']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-image-editor-backend:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ai-image-editor-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ai-image-editor-backend:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--set-env-vars'
      - 'ORCHESTRATOR_TYPE=openai,GOOGLE_PROJECT_ID=poc-augusta,GOOGLE_LOCATION=us-central1,PORT=8000,IMAGE_STORAGE_PATH=./generated_images,DEFAULT_PROVIDER=gemini,PREFERRED_GENERATE_PROVIDERS=gemini,PREFERRED_UPSCALE_PROVIDERS=gemini,PREFERRED_EDIT_PROVIDERS=gemini,PUBLIC_BASE_URL=https://ai-image-editor-backend-659729422033.us-central1.run.app,RECRAFT_URL=https://external.api.recraft.ai/v1'
      - '--port'
      - '8000'

images:
  - 'gcr.io/$PROJECT_ID/ai-image-editor-backend:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/ai-image-editor-backend:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

